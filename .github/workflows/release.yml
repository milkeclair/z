name: release-publish

run-name: Publish v${{ inputs.version }} (Marketplace ${{ inputs.publish_marketplace }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unified stable version for z and z-ls, without v (for example 2.4.0)'
        type: string
        required: true
      publish_marketplace:
        description: 'Also publish the released VSIX to Visual Studio Marketplace'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install lockfile verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify locked actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
      - name: Require release dispatch from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            printf '::error::Run releases from main.\n'
            exit 1
          fi

      - name: Verify server-enforced Marketplace branch restrictions
        if: inputs.publish_marketplace
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs environment "$RELEASE_REPOSITORY"

  github-release:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate the draft and saved body with draft visibility
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(node .github/scripts/release.mjs plan "$RELEASE_VERSION" "$RELEASE_REPOSITORY" "$RELEASE_SOURCE" publish)
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          check_ref="$RELEASE_SOURCE"
          if [[ "$mode" == resume ]]; then
            check_ref=$(git rev-parse "v$RELEASE_VERSION^{commit}")
          fi
          printf 'check_ref=%s\n' "$check_ref" >> "$GITHUB_OUTPUT"
      - name: Set release asset directory
        run: printf 'RELEASE_ASSETS=%s/release-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Revalidate and publish the draft using its saved Markdown
        if: steps.plan.outputs.mode != 'published'
        env:
          RELEASE_CHECK_REF: ${{ steps.plan.outputs.check_ref }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs publish "$RELEASE_VERSION" "$RELEASE_REPOSITORY" "$RELEASE_ASSETS" "$RUNNER_TEMP/release-notes.md" "$RELEASE_CHECK_REF"
      - name: Reuse the existing immutable release
        if: steps.plan.outputs.mode == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs download "$RELEASE_VERSION" "$RELEASE_REPOSITORY" "$RELEASE_ASSETS"

  marketplace:
    needs: github-release
    if: inputs.publish_marketplace
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ls/package-lock.json
      - name: Recheck Marketplace environment controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs environment "$RELEASE_REPOSITORY"
      - name: Set release asset directory
        run: printf 'RELEASE_ASSETS=%s/release-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the locked publishing tool without lifecycle scripts
        working-directory: ls
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and verify the original immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs download "$RELEASE_VERSION" "$RELEASE_REPOSITORY" "$RELEASE_ASSETS"
      - name: Publish the same VSIX using Trusted Publishing
        working-directory: ls
        run: ./node_modules/.bin/vsce publish --oidc --packagePath "$RELEASE_ASSETS/z-ls-$RELEASE_VERSION.vsix"
