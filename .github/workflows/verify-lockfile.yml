name: Verify action lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Install lockfile verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify locked actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
