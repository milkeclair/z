name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ''
      fail_node:
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to validate for a release retry'
        type: string
        default: ''

permissions:
  contents: read

env:
  ZSH_VERSION: '5.9.2'

jobs:
  zsh:
    name: test-zsh
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-zsh
        with:
          version: ${{ env.ZSH_VERSION }}

      - name: Run tests
        shell: bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          zsh -c "source main.zsh && cd test && z.t"

  node:
    name: test-node
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-zsh
        with:
          version: ${{ env.ZSH_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ls/package-lock.json

      - name: Test release tooling
        run: node --test .github/scripts/release.test.mjs

      - name: Install LSP dependencies
        working-directory: ls
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Run LSP tests
        working-directory: ls
        shell: bash
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm test -- --maxWorkers=2

      - name: Expected Node failure
        if: inputs.fail_node
        run: |
          echo EXPECTED_NODE_FAILURE
          exit 7

  test:
    if: ${{ always() }}
    needs: [zsh, node]
    runs-on: ubuntu-26.04
    steps:
      - name: Check all test suites passed
        shell: bash
        env:
          ZSH_RESULT: ${{ needs.zsh.result }}
          NODE_RESULT: ${{ needs.node.result }}
        run: |
          printf 'Zsh: %s; Node: %s\n' "$ZSH_RESULT" "$NODE_RESULT"
          [[ "$ZSH_RESULT" == 'success' && "$NODE_RESULT" == 'success' ]]

  check-zsh-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check latest stable zsh release
        shell: bash
        run: |
          stable_tag_pattern='^refs/tags/zsh-[0-9]+([.][0-9]+)+$'
          version_tag_prefix='^refs/tags/zsh-'
          latest_version=$(
            git ls-remote --tags --refs https://git.code.sf.net/p/zsh/code 'refs/tags/zsh-*' |
              awk -v pattern="$stable_tag_pattern" -v prefix="$version_tag_prefix" '$2 ~ pattern { sub(prefix, "", $2); print $2 }' |
              sort -V |
              tail -n 1
          )
          if [[ -z "$latest_version" ]]; then
            printf '::error::No stable zsh release tags were returned\n'
            exit 1
          fi
          printf 'Configured zsh: %s; latest stable release: %s\n' "$ZSH_VERSION" "$latest_version"
          if [[ "$latest_version" != "$ZSH_VERSION" ]]; then
            printf '::error::Review zsh %s and update ZSH_VERSION after testing\n' "$latest_version"
            exit 1
          fi
